<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">RVProbe Two-Stage Generation Flow</text>

  <!-- ================================================================ -->
  <!-- User Constraint Layer -->
  <!-- ================================================================ -->
  <rect x="30" y="52" width="840" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="50" y="72" font-size="11" font-weight="600" fill="#1d4ed8" letter-spacing="0.5">USER CONSTRAINT LAYER (Scala eDSL)</text>

  <!-- instruction() -->
  <rect x="50" y="84" width="160" height="76" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="130" y="104" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">instruction(i)</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#64748b">isAdd(), isAddi()</text>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#64748b">rdRange(), rs1Range()</text>
  <text x="130" y="148" text-anchor="middle" font-size="11" fill="#64748b">freshReg()</text>

  <!-- sequence + cover -->
  <rect x="230" y="84" width="200" height="76" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="330" y="104" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">sequence(0, n)</text>
  <text x="330" y="120" text-anchor="middle" font-size="11" fill="#64748b">coverBins(_.rd, allRegs)</text>
  <text x="330" y="134" text-anchor="middle" font-size="11" fill="#64748b">coverRAW() / coverWAR()</text>
  <text x="330" y="148" text-anchor="middle" font-size="11" fill="#64748b">coverWAW() / coverNoHazard()</text>

  <!-- sets -->
  <rect x="450" y="84" width="160" height="76" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="530" y="104" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">ISA Extension Sets</text>
  <text x="530" y="120" text-anchor="middle" font-size="11" fill="#64748b">isRV64GC()</text>
  <text x="530" y="134" text-anchor="middle" font-size="11" fill="#64748b">isRVM()</text>
  <text x="530" y="148" text-anchor="middle" font-size="11" fill="#64748b">isRVZIFENCEI()</text>

  <!-- riscv-opcodes DB -->
  <rect x="630" y="84" width="220" height="76" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="740" y="104" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">riscv-opcodes DB</text>
  <text x="740" y="120" text-anchor="middle" font-size="11" fill="#64748b">rvdecoderdb: 300+ instructions</text>
  <text x="740" y="134" text-anchor="middle" font-size="11" fill="#64748b">auto-generated constraints</text>
  <text x="740" y="148" text-anchor="middle" font-size="11" fill="#64748b">encoding &amp; field ranges</text>

  <!-- Arrow: User layer → Recipe -->
  <line x1="330" y1="172" x2="330" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================ -->
  <!-- Recipe (intermediate) -->
  <!-- ================================================================ -->
  <rect x="200" y="200" width="260" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="330" y="225" text-anchor="middle" font-weight="600" fill="#334155" font-size="13">Recipe</text>
  <text x="420" y="225" font-size="11" fill="#64748b">(indices + constraints + statements)</text>

  <!-- Fork arrows from Recipe -->
  <line x1="260" y1="240" x2="180" y2="278" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="400" y1="240" x2="580" y2="278" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- ================================================================ -->
  <!-- Stage 1 -->
  <!-- ================================================================ -->
  <rect x="30" y="280" width="340" height="160" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="50" y="300" font-size="11" font-weight="600" fill="#2563eb" letter-spacing="0.5">STAGE 1: OPCODE SOLVING</text>

  <rect x="50" y="310" width="300" height="28" rx="4" fill="#dbeafe"/>
  <text x="200" y="329" text-anchor="middle" font-size="12" fill="#1e40af">Emit set constraints + opcode constraints</text>

  <line x1="200" y1="338" x2="200" y2="352" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <rect x="50" y="354" width="300" height="28" rx="4" fill="#dbeafe"/>
  <text x="200" y="373" text-anchor="middle" font-size="12" fill="#1e40af">Z3 SMT Solver (via MLIR FFI)</text>

  <line x1="200" y1="382" x2="200" y2="396" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <rect x="50" y="398" width="300" height="28" rx="4" fill="#bfdbfe"/>
  <text x="200" y="417" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Output: nameId per index</text>
  <text x="345" y="417" font-size="10" fill="#64748b">(e.g., 0→add, 1→addi)</text>

  <!-- ================================================================ -->
  <!-- Stage 2 -->
  <!-- ================================================================ -->
  <rect x="410" y="280" width="460" height="160" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="430" y="300" font-size="11" font-weight="600" fill="#16a34a" letter-spacing="0.5">STAGE 2: ARGUMENT SOLVING</text>

  <rect x="430" y="310" width="420" height="28" rx="4" fill="#dcfce7"/>
  <text x="640" y="329" text-anchor="middle" font-size="12" fill="#166534">Fix opcodes + emit arg constraints + cover constraints</text>

  <line x1="640" y1="338" x2="640" y2="352" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <rect x="430" y="354" width="420" height="28" rx="4" fill="#dcfce7"/>
  <text x="640" y="373" text-anchor="middle" font-size="12" fill="#166534">Z3 SMT Solver — rd, rs1, rs2, imm + freshReg distinct</text>

  <line x1="640" y1="382" x2="640" y2="396" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <rect x="430" y="398" width="420" height="28" rx="4" fill="#bbf7d0"/>
  <text x="640" y="417" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Output: solved args per index</text>
  <text x="835" y="417" font-size="10" fill="#64748b">(rd=x3, rs1=x4, ...)</text>

  <!-- Arrow: Stage 1 → Stage 2 -->
  <path d="M 350 420 Q 390 460, 430 420" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="390" y="455" text-anchor="middle" font-size="10" fill="#64748b">fixed opcodes</text>

  <!-- ================================================================ -->
  <!-- Merge arrows -->
  <!-- ================================================================ -->
  <line x1="200" y1="440" x2="200" y2="478" stroke="#475569" stroke-width="1.5"/>
  <line x1="640" y1="440" x2="640" y2="478" stroke="#475569" stroke-width="1.5"/>
  <line x1="200" y1="478" x2="640" y2="478" stroke="#475569" stroke-width="1.5"/>
  <line x1="420" y1="478" x2="420" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================ -->
  <!-- Rendering -->
  <!-- ================================================================ -->
  <rect x="250" y="500" width="340" height="50" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="420" y="520" text-anchor="middle" font-weight="600" fill="#854d0e" font-size="13">Rendering</text>
  <text x="420" y="536" text-anchor="middle" font-size="11" fill="#a16207">opcodes + args → GAS assembly / binary encoding</text>

  <!-- ================================================================ -->
  <!-- Output -->
  <!-- ================================================================ -->
  <line x1="340" y1="550" x2="240" y2="578" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="550" x2="600" y2="578" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="580" width="240" height="44" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="240" y="600" text-anchor="middle" font-weight="600" fill="#334155" font-size="13">Assembly (.S)</text>
  <text x="240" y="616" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">addi x3, x4, 42</text>

  <rect x="480" y="580" width="240" height="44" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="600" y="600" text-anchor="middle" font-weight="600" fill="#334155" font-size="13">Binary (.bin)</text>
  <text x="600" y="616" text-anchor="middle" font-size="11" fill="#64748b" font-family="monospace">0x02a20193</text>

  <!-- ================================================================ -->
  <!-- Key insight callout -->
  <!-- ================================================================ -->
  <rect x="30" y="640" width="840" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="450" y="660" text-anchor="middle" font-size="12" fill="#991b1b">
    Key: coverRAW() / coverWAR() / coverWAW() / coverNoHazard() are Stage 2 cross-index constraints — sequence-level properties as first-class constructs
  </text>
</svg>
