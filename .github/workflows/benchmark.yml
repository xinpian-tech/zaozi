name: Zaozi Native Benchmark
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled

# Cancel the current workflow when new commit pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-benchmark:
    name: "Run zaozi Native benchmark"
    runs-on: [self-hosted, linux, nixos]
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -o pipefail
          nix develop -c mill --no-daemon --ticker false zaozi.benchmark.run 1 | tee -a "$GITHUB_STEP_SUMMARY"
