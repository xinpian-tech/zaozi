#
# AC-15 TOML-drift CI check. Runs after every push and PR to dev.
# Fires red whenever upstream `riscv-vector-tests` toml content hashes
# diverge from the committed `rvprobe/src/rvv/audit/snapshots/`, with
# the 3-commit refresh instructions printed in the failure message:
#   1. bump pinned upstream commit ref
#   2. mill rvprobe.runMain ...writeAuditFixtures rvprobe/src/rvv/audit
#   3. mill rvprobe.runMain ...regenerateInsns rvprobe/src/rvv/insns
# Human reviews the predicate diff and commits all three together.

name: rvv toml drift check

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zaozi
        uses: actions/checkout@v4

      - name: Checkout upstream riscv-vector-tests (PINNED COMMIT)
        uses: actions/checkout@v4
        with:
          repository: chipsalliance/riscv-vector-tests
          path: riscv-vector-tests
          # AC-15 requires a pinned upstream commit hash (NOT a moving
          # branch). The 3-commit refresh workflow bumps this hash
          # alongside audit/snapshots regeneration + human-reviewed
          # predicate diff. Tracking a moving branch would make CI
          # status depend on upstream changes unrelated to the pin.
          #
          # Bump procedure:
          #   1. Update this hash to the desired upstream commit.
          #   2. Run: mill rvprobe.runMain ...writeAuditFixtures \
          #          rvprobe/src/rvv/audit
          #   3. Run: mill rvprobe.runMain ...regenerateInsns \
          #          rvprobe/src/rvv/insns
          #   4. Human-review the predicate diff and commit all four
          #      changes together (workflow, snapshots, reports, insns).
          ref: 5acff36b6a87a36c6ff9bc4ad0b1a16cdfe7df8a

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run drift check
        env:
          RVPROBE_RVV_TESTS_CONFIGS: ${{ github.workspace }}/riscv-vector-tests/configs
        run: |
          nix develop . -c mill rvprobe.runMain \
            me.jiuyang.rvprobe.rvv.audit.runDriftCheck
