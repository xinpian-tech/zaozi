[package]
name = "simprobe"
version = "0.1.0"
edition = "2021"
description = "A probe-rs debug probe whose JTAG pins are a simulation's, over the DPI bridge"

[dependencies]
probe-rs = { version = "0.32", default-features = false }
bitvec = "1"
anyhow = "1"

[[bin]]
name = "simprobe"
path = "src/main.rs"
